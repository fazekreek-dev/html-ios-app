name: Build Unsigned Webview IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Capacitor & Add iOS Platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "My HTML App" "com.example.htmlapp" --web-dir=www
          npx cap add ios

      - name: Force Higher iOS Deployment Target
        run: |
          # Bumps the target to 15.0 whether it uses single or double quotes
          sed -i '' 's/platform :ios, .*/platform :ios, '\''15.0'\''/g' ios/App/Podfile
          
          # Print the file to verify the target changed successfully
          cat ios/App/Podfile
          
          # Sync the native structure and run cocoapods install
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Package Into IPA File
        run: |
          mkdir -p Payload
          mv ios/App/build/Release-iphoneos/App.app Payload/
          zip -r App-Unsigned.ipa Payload

      - name: Download Your IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: App-Unsigned.ipa
