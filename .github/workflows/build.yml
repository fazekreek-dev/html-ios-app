name: Build Unsigned Webview IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14  # Uses a highly stable macOS runner configuration
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Stable Capacitor 6
        run: |
          npm init -y
          # Installing Capacitor 6 avoids the iOS 15 conflict entirely
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap init "My HTML App" "com.example.htmlapp" --web-dir=www

      - name: Create Native iOS Project
        run: |
          npx cap add ios

      - name: Sync Dependencies
        run: |
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Package Into IPA File
        run: |
          mkdir -p Payload
          mv ios/App/build/Release-iphoneos/App.app Payload/ || mv ios/App/build/Products/Release-iphoneos/App.app Payload/ || true
          zip -r App-Unsigned.ipa Payload

      - name: Download Your IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: App-Unsigned.ipa
