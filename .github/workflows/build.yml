name: Build Unsigned Webview IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Capacitor & Create Directory
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "My HTML App" "com.example.htmlapp" --web-dir=www
          
          # Force create the directory structure so it physically exists
          mkdir -p ios/App
          
          # Manually inject a custom Podfile targeting iOS 15.0 directly
          cat << 'EOF' > ios/App/Podfile
          platform :ios, '15.0'
          use_frameworks!
          
          target 'App' do
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end
          EOF

      - name: Initialize Platform & Sync
        run: |
          # Safe add and sync now that the file framework is established
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Package Into IPA File
        run: |
          mkdir -p Payload
          mv ios/App/build/Release-iphoneos/App.app Payload/ || mv ios/App/build/Products/Release-iphoneos/App.app Payload/ || true
          zip -r App-Unsigned.ipa Payload

      - name: Download Your IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: App-Unsigned.ipa
