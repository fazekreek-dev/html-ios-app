name: Build Unsigned Webview IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Stable Capacitor 6 & Assets Tool
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          # Installs the official Apple icon generation tool
          npm install @capacitor/assets --save-dev
          
          # Initializes the app with your custom App Name "CloudFurm"
          npx cap init "CloudFurm" "com.example.cloudfurm" --web-dir=www

      - name: Create Native iOS Project
        run: |
          npx cap add ios

      - name: Generate Custom App Icons
        run: |
          # Automatically converts your icon.png into all required Apple dimensions
          npx cordova-res ios --skip-config --copy || npx cap assets generate --ios || true

      - name: Force Code Copy & Sync
        run: |
          npx cap copy ios
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Package Into IPA File
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App-Unsigned.ipa Payload

      - name: Download Your IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: App-Unsigned.ipa
