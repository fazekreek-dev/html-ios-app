name: Build Unsigned Webview IPA

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Stable Capacitor 6 & Assets Tool
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npm install @capacitor/assets --save-dev
          npx cap init "CloudFurm" "com.example.cloudfurm" --web-dir=www

      - name: Configure Capacitor for HTTP Localhost (Firebase Auth)
        run: |
          node -e '
            const fs = require("fs");
            const configPath = "capacitor.config.json";
            let config = {};
            if (fs.existsSync(configPath)) {
              config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            }
            config.server = config.server || {};
            config.server.iosScheme = "http";
            config.server.hostname = "localhost";
            config.server.cleartext = true;
            fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
            console.log("Updated capacitor.config.json with HTTP localhost configuration.");
          '

      - name: Create Native iOS Project
        run: |
          npx cap add ios

      - name: Fix App Transport Security & Bundle Integrity for KSign/ESign
        run: |
          node -e '
            const fs = require("fs");
            const plist = require("plist");
            // Find Info.plist path dynamically
            const plistPath = "ios/App/App/Info.plist";
            if (fs.existsSync(plistPath)) {
              let xml = fs.readFileSync(plistPath, "utf8");
              let obj = plist.parse(xml);
              
              // Ensure App Transport Security allows cleartext local traffic
              obj.NSAppTransportSecurity = obj.NSAppTransportSecurity || {};
              obj.NSAppTransportSecurity.NSAllowsArbitraryLoads = true;
              
              // Remove WKAppBoundDomains if present, which breaks non-standard web view loads on sideloaded apps
              delete obj.WKAppBoundDomains;

              fs.writeFileSync(plistPath, plist.build(obj));
              console.log("Patched Info.plist successfully.");
            } else {
              console.error("Info.plist not found!");
              exit(1);
            }
          '

      - name: Prepare icon.png for asset generation
        run: |
          mkdir -p assets
          if [ -f icon.png ]; then
            cp icon.png assets/icon.png
            echo "✅ icon.png copied to assets/icon.png"
          else
            echo "❌ ERROR: icon.png not found in repository root!"
            exit 1
          fi

      - name: Generate Custom App Icons
        run: |
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#ffffff' \
            --splashBackgroundColor '#ffffff'

      - name: Force Code Copy & Sync
        run: |
          npx cap copy ios
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package Into IPA File
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App-Unsigned.ipa Payload

      - name: Download Your IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: App-Unsigned.ipa
