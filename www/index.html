                const chunkSize = 8000;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    const slice = bytes.subarray(i, i + chunkSize);
                    decodedHTML += String.fromCharCode(...slice);
                }

                document.open();
                document.write(decodedHTML);
                document.close();
            } catch (err) {
                document.body.innerHTML = '<p style="color:#e63946; text-align:center; margin-top:20vh; font-family:sans-serif;">Decoding Failed: String is invalid or corrupted.</p>';
            }
        })();
    </script>
</body>
</html>
